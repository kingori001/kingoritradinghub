<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHSP Installer Slideshow</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  :root {
    --bg-color: #ffffff;
    --text-color: #ffffff;
    --accent-gray: #717171;
  }

  html {
    background-color: var(--bg-color);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
  }

  /* Slideshow container */
  .slideshow-container {
    max-width: 445px;
    position: relative;
    margin: auto;
    overflow: hidden;
    border-radius: 8px;
    cursor: pointer;
  }

  .mySlides {
    display: none;
    position: relative;
    width: 100%;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
  }

  .mySlides.active-slide {
    display: block;
    opacity: 1;
  }

  .mySlides img {
    width: 100%;
    height: auto;
    vertical-align: middle;
    display: block;
  }

  /* Caption text */
  .text {
    font-family: 'AdobeClean', Helvetica, Arial, sans-serif;
    color: var(--text-color);
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.3px;
    padding: 10px 20px;
    position: absolute;
    bottom: 20px;
    left: 0;
    width: 100%;
    text-align: left;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  }

  /* Number text (1/3 etc) */
  .numbertext {
    font-family: 'AdobeClean', Helvetica, Arial, sans-serif;
    color: #f2f2f2;
    font-size: 12px;
    padding: 8px 12px;
    position: absolute;
    top: 0;
    left: 0;
    background: rgba(0,0,0,0.4);
    border-bottom-right-radius: 6px;
  }

  /* Responsive adjustments */
  @media only screen and (max-width: 300px) {
    .text {
      font-size: 11px;
    }
  }
</style>
</head>
<body>

<div class="slideshow-container" id="slideContainer">
  <div class="mySlides active-slide">
    <div class="numbertext">1 / 1</div>
    <img src="images/01_creativity_for_all_445x239.jpg" alt="Creativity for all">
    <div class="text" id="slideText1">Creativity for all.</div>
  </div>
</div>

<script type="text/javascript" src="lib/jquery.min.js"></script>
<script type="text/javascript" src="carousel.js"></script>
</body>
</html>
